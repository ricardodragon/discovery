server:
  port: 7081
spring:
  application:
    name: discovery
eureka:
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
  client:
    registerWithEureka: false
    connect-timeout-seconds: 5
    read-timeout-seconds: 8
    fetchRegistry: false
    service-url:
      defaultZone: http://localhost:${server.port}/eureka